<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Set a new password for your TradeCircle account.">
  <title>Choose a new password | TradeCircle</title>
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body class="auth-page">
  <header class="auth-page-header">
    <a class="brand" href="index.html" aria-label="TradeCircle home">
      <img class="tradecircle-logo-image" src="tradecircle-logo.png" alt="">
      <span class="tradecircle-wordmark"><span>TradeCircle</span><small>Wholesale, United.</small></span>
    </a>
    <a class="auth-home-link" href="auth.html?mode=login">Back to log in</a>
  </header>

  <main class="auth-page-main">
    <section class="auth-dialog auth-page-card" aria-labelledby="resetPasswordTitle">
      <span class="eyebrow">TRADECIRCLE ACCOUNT</span>
      <h1 id="resetPasswordTitle">Choose a new password</h1>
      <p>Choose a password with at least 10 characters.</p>
      <form id="resetPasswordForm">
        <label class="auth-field">New password
          <input name="password" type="password" minlength="10" maxlength="128"
                 autocomplete="new-password" required>
        </label>
        <label class="auth-field">Confirm new password
          <input name="confirm_password" type="password" minlength="10" maxlength="128"
                 autocomplete="new-password" required>
        </label>
        <p id="resetPasswordMessage" class="auth-message" role="status" hidden></p>
        <button id="resetPasswordSubmit" class="button primary-button is-fullwidth" type="submit">
          Reset password
        </button>
      </form>
      <a id="resetPasswordLoginLink" class="auth-home-link reset-password-login-link"
         href="auth.html?mode=login" hidden>Return to log in</a>
    </section>
  </main>
  <script src="reset-password.js?v=1"></script>
</body>
</html>
