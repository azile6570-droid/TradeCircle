<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Request a secure password reset link for your TradeCircle account.">
  <title>Reset password | TradeCircle</title>
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body class="auth-page">
  <header class="auth-page-header">
    <a class="brand" href="index.html" aria-label="TradeCircle home">
      <img class="tradecircle-logo-image" src="tradecircle-logo.png" alt="">
      <span class="tradecircle-wordmark"><span>TradeCircle</span><small>Wholesale, United.</small></span>
    </a>
    <a class="auth-home-link" href="auth.html?mode=login">Back to log in</a>
  </header>

  <main class="auth-page-main">
    <section class="auth-dialog auth-page-card" aria-labelledby="forgotPasswordTitle">
      <span class="eyebrow">TRADECIRCLE ACCOUNT</span>
      <h1 id="forgotPasswordTitle">Forgot your password?</h1>
      <p>Enter the email address for your account. If it matches, we’ll send a secure reset link.</p>
      <form id="forgotPasswordForm">
        <label class="auth-field">Work email address
          <input name="email" type="email" maxlength="255" autocomplete="email" required>
        </label>
        <p id="forgotPasswordMessage" class="auth-message" role="status" hidden></p>
        <button id="forgotPasswordSubmit" class="button primary-button is-fullwidth" type="submit">
          Send reset link
        </button>
      </form>
    </section>
  </main>
  <script src="forgot-password.js?v=1"></script>
</body>
</html>
